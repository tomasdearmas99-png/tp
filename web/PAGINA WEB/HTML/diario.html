<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.H.I.E.L.D. - Suministro Diario</title>
  <link rel="stylesheet" href="../../CSS/style.css">
  <style>
    .diario-body { background-color: #0c0c0c; color: #fff; font-family: sans-serif; text-align: center; padding: 50px 20px; }
    .recompensa-caja { background-color: #161616; border: 1px solid #2a2a2a; max-width: 400px; margin: 40px auto; padding: 40px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .recompensa-caja h2 { color: #e62429; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; }
    .moneda-visual { width: 120px; height: 120px; margin: 20px auto; display: flex; justify-content: center; align-items: center; background-color: #222; border: 2px dashed #c4b494; border-radius: 50%; font-size: 40px; color: #c4b494; }
    .btn-reclamar { width: 100%; padding: 14px; background-color: #e62429; border: none; color: white; font-weight: bold; text-transform: uppercase; border-radius: 4px; cursor: pointer; letter-spacing: 1px; transition: background-color 0.2s; }
    .btn-reclamar:hover { background-color: #b31b1e; }
    .mensaje-consola { margin-top: 20px; font-size: 13px; color: #aaa; line-height: 1.5; min-height: 40px; }
    .btn-inicio { color: #555; text-decoration: none; font-size: 13px; display: inline-block; margin-top: 20px; }
    .btn-inicio:hover { color: #fff; }
  </style>
</head>
<body class="diario-body">

  <div class="recompensa-caja">
    <h2>Suministro Diario</h2>
    <p style="color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Protocolo de Financiación Stark</p>
    
    <div class="moneda-visual">🪙</div>
    
    <button id="btn-trigger-diario" class="btn-reclamar">Asegurar Suministros</button>
    <div id="consola-reporte" class="mensaje-consola">Presiona el botón para verificar la disponibilidad de créditos con el Helicarrier...</div>
    
    <a href="../../../index.html" class="btn-inicio">← Volver al Inicio</a>
  </div>

  <script>
    document.getElementById('btn-trigger-diario').addEventListener('click', () => {
        const reporte = document.getElementById('consola-reporte');
        reporte.innerText = "Sincronizando coordenadas temporales...";

        fetch('../../PHP/reclamo_diario.php')
            .then(res => res.json())
            .then(data => {
                reporte.innerText = data.mensaje;
                if(data.status === 'success') {
                    reporte.style.color = "#22c55e"; // Verde éxito
                } else if(data.status === 'bloqueado') {
                    reporte.style.color = "#eab308"; // Amarillo advertencia
                } else {
                    reporte.style.color = "#ef4444"; // Rojo error
                }
            })
            .catch(err => {
                reporte.innerText = "Error de comunicación con la base de datos de S.H.I.E.L.D.";
                reporte.style.color = "#ef4444";
            });
    });
  </script>
</body>
</html>
